name: Build Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows-vst3:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --target PaduAmp_VST3 --parallel 2

      - name: Locate VST3
        shell: pwsh
        run: |
          $vst = Get-ChildItem -Path build -Recurse -Filter "Padu Amp.vst3" | Select-Object -First 1
          if (-not $vst) { throw "Padu Amp.vst3 was not produced" }
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item -Recurse -Force $vst.FullName "artifact/Padu Amp.vst3"

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Padu-Amp-Windows-VST3
          path: artifact/Padu Amp.vst3
          if-no-files-found: error
